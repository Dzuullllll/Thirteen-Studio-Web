<style>
:root{
  --gold:#d4af37; --gold-l:#f0d98a; --gold-d:#8f6a14;
  --ink:#040404; --panel:rgba(12,11,9,.72); --line:rgba(212,175,55,.2);
  --txt:#f4f0e8; --mute:#a9a39a;
  --hh:68px; --bn:0px;
  --pad:clamp(16px,4vw,40px);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--txt);font:400 clamp(14px,1.5vw,16px)/1.65 'Plus Jakarta Sans',system-ui,sans-serif;min-height:100svh;overflow-x:hidden}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3,.brand-name{font-family:Cinzel,serif;letter-spacing:.02em}

/* Latar */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-img{position:absolute;inset:-3%;background:var(--nature) center/cover;filter:saturate(.5) contrast(1.15) brightness(.3);animation:drift 30s ease-in-out infinite alternate}
.bg-shade{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(0,0,0,.1),rgba(0,0,0,.78) 72%),linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.9))}
@keyframes drift{to{transform:scale(1.07) translate(-1%,-.6%)}}
.leaf-layer{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.leaf{position:absolute;top:-6vh;width:var(--s);height:calc(var(--s)*.58);background:linear-gradient(135deg,#9a7621,#d4af37 55%,#6d4e0b);border-radius:100% 0;opacity:var(--o);animation:fall var(--d) linear var(--dl) infinite}
@keyframes fall{from{transform:translate3d(0,-8vh,0) rotate(var(--r))}to{transform:translate3d(var(--dr),112vh,0) rotate(calc(var(--r) + 480deg))}}

/* Header */
header{position:fixed;inset:0 0 auto 0;height:calc(var(--hh) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(var(--pad),env(safe-area-inset-left)) 0 max(var(--pad),env(safe-area-inset-right));z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(3,3,3,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:46px;height:36px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(212,175,55,.3))}
.brand-name{font-weight:800;font-size:1.05rem;letter-spacing:.22em;line-height:1;background:linear-gradient(135deg,var(--gold-l),var(--gold) 55%,var(--gold-d));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:.62rem;letter-spacing:.38em;color:var(--gold);opacity:.8;margin-top:5px}
.nav-d{display:flex;gap:4px;padding:5px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.45)}
.nav-btn{border:0;background:none;cursor:pointer;color:var(--mute);padding:9px 18px;border-radius:999px;font-weight:600;font-size:.85rem;display:inline-flex;align-items:center;gap:7px;transition:.25s}
.nav-btn:hover{color:var(--txt)}
.nav-btn.on{color:var(--gold-l);background:rgba(212,175,55,.12);box-shadow:inset 0 0 0 1px rgba(212,175,55,.3)}
.actions{display:flex;gap:10px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.55);color:var(--gold);display:grid;place-items:center;cursor:pointer;transition:.25s}
.icon-btn:hover{border-color:var(--gold);transform:scale(1.06)}
.icon-btn svg{width:19px;height:19px}
.music .ic-on{display:none}
.music.playing{background:rgba(212,175,55,.16);border-color:var(--gold);box-shadow:0 0 22px rgba(212,175,55,.25)}
.music.playing .ic-on{display:grid}
.music.playing .ic-off{display:none}
.music:not(.playing){color:var(--mute)}

/* Tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 26px;border-radius:999px;font-weight:700;font-size:.88rem;cursor:pointer;border:1px solid var(--line);background:rgba(0,0,0,.5);transition:.25s;text-align:center}
.btn:hover{transform:translateY(-2px);border-color:var(--gold)}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px}
.btn.gold{background:linear-gradient(135deg,var(--gold-l),var(--gold) 55%,var(--gold-d));color:#1a1305;border-color:transparent;box-shadow:0 10px 30px rgba(212,175,55,.2)}
.btn.block{width:100%}

/* Layout */
main{position:relative;z-index:10;padding:calc(var(--hh) + env(safe-area-inset-top) + 24px) max(var(--pad),env(safe-area-inset-left)) calc(60px + var(--bn) + env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-right))}
.wrap{max-width:1180px;margin:0 auto}
.tab{display:none}
.tab.on{display:block;animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.sec-head{text-align:center;max-width:640px;margin:clamp(20px,5vw,48px) auto clamp(24px,5vw,44px)}
.sec-head .badge{display:inline-block;font-size:.72rem;color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:5px 16px}
.sec-head h2{font-size:clamp(1.8rem,5vw,3.2rem);font-weight:800;margin:14px 0 10px;line-height:1.15}
.sec-head p,.muted{color:var(--mute)}
.grid{display:grid;gap:clamp(16px,2.5vw,28px)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{background:linear-gradient(150deg,rgba(16,15,12,.8),rgba(4,4,4,.78));border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .3s,border-color .3s,box-shadow .3s}
@media (hover:hover){.card.lift:hover{transform:translateY(-6px);border-color:rgba(212,175,55,.5);box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 34px rgba(212,175,55,.08)}}

/* Hero */
.hero{text-align:center;padding:clamp(8px,4vw,40px) 0 clamp(20px,4vw,40px)}
.hero-logo{width:min(78vw,400px);height:clamp(110px,26vh,240px);margin:0 auto clamp(12px,3vw,28px);position:relative}
.hero-logo::before{content:"";position:absolute;inset:15%;border-radius:50%;background:rgba(212,175,55,.14);filter:blur(60px)}
.hero-logo img{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 30px rgba(212,175,55,.3))}
.hero h1{font-size:clamp(1.9rem,6.4vw,4.6rem);line-height:1.1;font-weight:800;max-width:15ch;margin:0 auto 18px;text-wrap:balance}
.hero h1 em{font-style:normal;display:block;background:linear-gradient(135deg,#fff7d6,#e8c76a 48%,#a77a16);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:620px;margin:0 auto 30px;color:var(--mute);font-size:clamp(.95rem,2vw,1.1rem)}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

/* Running text */
.ticker{margin:clamp(26px,5vw,44px) calc(var(--pad) * -1) 0;border-block:1px solid var(--line);background:rgba(0,0,0,.5);overflow:hidden;padding:13px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker-track{display:flex;width:max-content;animation:tick var(--dur,40s) linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track span{white-space:nowrap;padding:0 22px;color:var(--gold-l);font-size:.86rem;font-weight:500;display:inline-flex;align-items:center;gap:44px}
.ticker-track span::after{content:"◆";color:var(--gold-d);font-size:.55rem}
@keyframes tick{to{transform:translateX(-50%)}}

.feat{padding:clamp(20px,3vw,32px)}
.ico{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:rgba(212,175,55,.08);display:grid;place-items:center;color:var(--gold);margin-bottom:18px}
.ico svg{width:24px;height:24px}
.feat h3,.pbody h3{font-size:1.15rem;margin-bottom:8px}
.feat p,.pbody p{color:var(--mute);font-size:.88rem}

/* Project & produk */
.card.col{display:flex;flex-direction:column;overflow:hidden}
.thumb{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#1b160a,#050505);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.card:hover .thumb img{transform:scale(1.05)}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold)}
.thumb .ph svg{width:56px;height:56px;opacity:.8}
.tag{position:absolute;top:12px;right:12px;font-size:.72rem;font-weight:600;color:var(--gold-l);background:rgba(0,0,0,.8);border:1px solid var(--line);padding:4px 12px;border-radius:999px;backdrop-filter:blur(6px)}
.pbody{padding:clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:14px;flex:1}
.pbody p{flex:1}
.price{font-family:Cinzel,serif;font-weight:700;color:var(--gold-l);font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:rgba(0,0,0,.4);border-radius:999px;padding:7px 14px;font-size:.78rem;cursor:pointer;color:var(--mute);transition:.2s}
.chip.on{color:#1a1305;background:var(--gold);border-color:var(--gold);font-weight:700}

.banner{margin-top:clamp(24px,4vw,40px);padding:clamp(20px,4vw,40px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
.banner .l{display:flex;align-items:center;gap:18px;flex:1 1 320px}
.banner .ico{margin:0;flex-shrink:0}
.banner h3{font-size:1.25rem}

/* Forge */
.forge{display:grid;gap:clamp(16px,2.5vw,28px);grid-template-columns:5fr 7fr}
.forge .card{padding:clamp(20px,3.5vw,34px)}
.steps{list-style:none;padding:20px 0 0;margin:20px 0 0;border-top:1px solid var(--line);display:grid;gap:14px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:center;color:var(--mute);font-size:.86rem;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;flex-shrink:0;border-radius:50%;border:1px solid var(--line);background:rgba(212,175,55,.1);color:var(--gold);display:grid;place-items:center;font-size:.75rem;font-weight:700}
form{display:grid;gap:18px}
label{display:block;font-size:.78rem;color:var(--mute);margin-bottom:7px;font-weight:600}
input,select,textarea{width:100%;background:rgba(0,0,0,.6);border:1px solid rgba(212,175,55,.18);border-radius:14px;padding:13px 16px;font-size:16px;transition:.2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
textarea{resize:vertical;min-height:110px}
select option{background:#0a0a0a}

footer{position:relative;z-index:10;border-top:1px solid var(--line);background:rgba(0,0,0,.82);padding:34px max(var(--pad),env(safe-area-inset-left)) calc(34px + var(--bn) + env(safe-area-inset-bottom));font-size:.8rem;color:var(--mute)}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px 30px;align-items:center;justify-content:space-between}
footer strong{color:var(--gold)}
footer nav{display:flex;gap:22px}
footer nav a:hover{color:var(--gold)}

.nav-m{display:none}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--bn) + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:100;background:#0d0b06;border:1px solid var(--gold);color:var(--gold-l);padding:12px 22px;border-radius:999px;font-size:.85rem;transition:.35s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Responsive */
@media (max-width:900px){
  :root{--hh:60px;--bn:64px}
  .nav-d,.actions .discord{display:none}
  .forge{grid-template-columns:1fr}
  .nav-m{display:flex;position:fixed;inset:auto 0 0 0;z-index:55;height:calc(var(--bn) + env(safe-area-inset-bottom));padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:rgba(3,3,3,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
  .nav-m .nav-btn{flex:1;flex-direction:column;gap:3px;border-radius:0;font-size:.66rem;padding:8px 2px;background:none;box-shadow:none}
  .nav-m .nav-btn svg{width:21px;height:21px}
  .nav-m .nav-btn.on{color:var(--gold-l);background:none;box-shadow:none}
  .nav-m .nav-btn.on svg{filter:drop-shadow(0 0 8px rgba(212,175,55,.6))}
  footer .wrap{justify-content:center;text-align:center}
}
@media (max-width:480px){
  .brand-sub{display:none}
  .brand img{width:40px;height:32px}
  .cta .btn{flex:1 1 100%}
}
/* HP landscape / layar pendek */
@media (max-height:520px) and (orientation:landscape){
  :root{--hh:50px;--bn:50px}
  .hero{display:grid;grid-template-columns:auto 1fr;gap:6px 28px;text-align:left;align-items:center}
  .hero-logo{grid-row:1/4;width:200px;height:150px;margin:0}
  .hero h1,.hero p{margin-left:0;max-width:none}
  .hero h1{font-size:clamp(1.5rem,4.4vw,2.4rem)}
  .hero p{margin-bottom:16px}
  .cta{justify-content:flex-start}
  .btn{padding:10px 20px}
  .nav-m{height:calc(var(--bn) + env(safe-area-inset-bottom))}
  .nav-m .nav-btn{flex-direction:row;justify-content:center;gap:6px;font-size:.72rem}
  .sec-head{margin:12px auto 20px}
}
@media (min-width:1600px){.wrap{max-width:1360px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.leaf-layer{display:none}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><div class="bg-img"></div><div class="bg-shade"></div></div>
<div class="leaf-layer" id="leaves" aria-hidden="true"></div>

<header>
  <a href="#" class="brand" data-tab="dashboard">
    <img id="logo-h" alt="Thirteen Studio">
    <div><div class="brand-name" id="b-name"></div><div class="brand-sub" id="b-studio"></div></div>
  </a>
  <nav class="nav-d" id="nav-d" aria-label="Menu utama"></nav>
  <div class="actions">
    <button id="music" class="icon-btn music" aria-label="Musik">
      <span class="ic-on"><i data-lucide="volume-2"></i></span>
      <span class="ic-off"><i data-lucide="volume-x"></i></span>
    </button>
    <a class="btn gold discord" data-link="discord" target="_blank" rel="noopener" style="padding:10px 20px"><i data-lucide="message-square"></i>Discord</a>
  </div>
</header>
<nav class="nav-m" id="nav-m" aria-label="Menu utama"></nav>

<main><div class="wrap">

  <section id="tab-dashboard" class="tab on">
    <div class="hero">
      <div class="hero-logo"><img id="logo-hero" alt="Thirteen Studio"></div>
      <h1><span id="h-title"></span> <em id="h-hl"></em></h1>
      <p id="h-desc"></p>
      <div class="cta" id="h-cta"></div>
    </div>
    <div class="ticker" id="ticker" hidden><div class="ticker-track" id="ticker-track"></div></div>
    <div class="grid g3" id="features" style="margin-top:clamp(28px,5vw,56px)"></div>
  </section>

  <section id="tab-creations" class="tab">
    <div class="sec-head" id="cr-head"></div>
    <div class="grid g2" id="projects"></div>
    <div class="card banner" id="community"></div>
  </section>

  <section id="tab-products" class="tab">
    <div class="sec-head" id="pr-head"></div>
    <div class="grid g3" id="products"></div>
  </section>

  <section id="tab-commissions" class="tab">
    <div class="sec-head" id="fg-head"></div>
    <div class="forge">
      <div class="card" style="display:flex;flex-direction:column;justify-content:space-between">
        <div id="fg-info"></div>
        <a class="btn block" data-link="discord" target="_blank" rel="noopener" style="margin-top:26px" id="fg-discord"></a>
      </div>
      <div class="card">
        <form id="order-form">
          <div><label for="f-user">Username Roblox / Discord</label><input id="f-user" required placeholder="misal: @username" autocomplete="off"></div>
          <div><label for="f-type">Jenis layanan</label><select id="f-type"></select></div>
          <div><label for="f-desc">Deskripsi proyek & ukuran map</label><textarea id="f-desc" required placeholder="Jelaskan tema, perkiraan ukuran map, dan referensi visual..."></textarea></div>
          <button type="submit" class="btn gold block" id="f-submit"></button>
        </form>
      </div>
    </div>
  </section>

</div></main>

<footer><div class="wrap">
  <div><strong id="ft-name"></strong> — <span id="ft-tag"></span></div>
  <div>Dibuat oleh <strong id="ft-by"></strong></div>
  <nav><a data-link="discord" target="_blank" rel="noopener">Discord</a><a data-link="robloxGroup" target="_blank" rel="noopener">Roblox Group</a></nav>
</div></footer>
<div id="toast" role="status"></div>

<script>
const C = SITE_CONFIG;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fill = (t, o) => t.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '');
const ico = n => `<i data-lucide="${esc(n)}"></i>`;

/* ---------- Dasar ---------- */
document.title = C.brand.pageTitle;
document.documentElement.style.setProperty('--nature', `url("${C.background.natureImage}")`);
$('#b-name').textContent = C.brand.name;
$('#b-studio').textContent = C.brand.studio;
['#logo-h', '#logo-hero'].forEach(s => $(s).src = C.brand.logo);
document.querySelectorAll('[data-link]').forEach(a => a.href = C.links[a.dataset.link]);

/* ---------- Navigasi ---------- */
const navHTML = C.nav.map(n => `<button class="nav-btn" data-tab="${n.id}" aria-label="${esc(n.label)}">${ico(n.icon)}<span>${esc(n.label)}</span></button>`).join('');
$('#nav-d').innerHTML = navHTML;
$('#nav-m').innerHTML = navHTML;

function switchTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id === 'tab-' + id));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { e.preventDefault(); switchTab(t.dataset.tab); }
});

/* ---------- Hero ---------- */
$('#h-title').textContent = C.hero.title;
$('#h-hl').textContent = C.hero.highlight;
$('#h-desc').textContent = C.hero.description;
const b1 = C.hero.primaryButton, b2 = C.hero.secondaryButton;
$('#h-cta').innerHTML =
  `<button class="btn gold" data-tab="${b1.tab}">${ico(b1.icon)}${esc(b1.label)}</button>` +
  `<button class="btn" data-tab="${b2.tab}">${ico(b2.icon)}${esc(b2.label)}</button>`;

/* ---------- Running text ---------- */
if (C.ticker.enabled && C.ticker.items.length) {
  const row = C.ticker.items.map(t => `<span>${esc(t)}</span>`).join('');
  const track = $('#ticker-track');
  $('#ticker').hidden = false;           // harus tampil dulu supaya lebarnya bisa diukur
  track.innerHTML = row;
  // ulangi sampai lebih lebar dari layar (maks 20x sebagai pengaman), lalu gandakan untuk loop mulus
  let guard = 0;
  while (track.scrollWidth > 0 && track.scrollWidth < window.innerWidth * 1.2 && guard++ < 20) track.innerHTML += row;
  track.innerHTML += track.innerHTML;
  const setSpeed = () => track.style.setProperty('--dur', Math.max(10, track.scrollWidth / 2 / C.ticker.speed) + 's');
  setSpeed();
  window.addEventListener('resize', setSpeed);
}

/* ---------- Fitur ---------- */
$('#features').innerHTML = C.features.map(f =>
  `<div class="card feat lift"><div class="ico">${ico(f.icon)}</div><h3>${esc(f.title)}</h3><p>${esc(f.text)}</p></div>`).join('');

/* ---------- Header section ---------- */
const head = (b, s) => `<span class="badge">${esc(b.badge)}</span><h2>${esc(b.title)}</h2><p>${esc(b.subtitle)}</p>`;
$('#cr-head').innerHTML = head(C.creations);
$('#pr-head').innerHTML = head(C.products);
$('#fg-head').innerHTML = head(C.forge);

/* ---------- Creations ---------- */
$('#projects').innerHTML = C.projects.map(p => `
  <article class="card col lift">
    <div class="thumb"><img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy" onerror="this.remove()"><span class="tag">${esc(p.category)}</span></div>
    <div class="pbody"><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p>
      <a class="btn gold block" href="${esc(p.link)}" target="_blank" rel="noopener">${ico('play')}${esc(C.creations.playLabel)}</a></div>
  </article>`).join('');
const cm = C.creations.community;
$('#community').innerHTML = `<div class="l"><div class="ico">${ico('users')}</div><div><h3>${esc(cm.title)}</h3><p class="muted" style="font-size:.88rem">${esc(cm.text)}</p></div></div>
  <a class="btn gold" data-link="robloxGroup" href="${esc(C.links.robloxGroup)}" target="_blank" rel="noopener">${esc(cm.button)}</a>`;

/* ---------- Produk ---------- */
$('#products').innerHTML = C.products.items.map((p, i) => {
  const opts = p.options?.length;
  const media = p.image
    ? `<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy" onerror="this.remove()">`
    : '';
  const ph = `<div class="ph">${ico(p.icon || 'box')}</div>`;
  const tag = p.badge ? `<span class="tag">${esc(p.badge)}</span>` : '';
  const chips = opts ? `<div class="chips">${p.options.map((o, j) => `<button type="button" class="chip${j ? '' : ' on'}" data-opt="${j}">${esc(o.label)}</button>`).join('')}</div>` : '';
  const price = opts ? p.options[0].price : p.price;
  return `<article class="card col lift" data-i="${i}">
    <div class="thumb">${ph}${media}${tag}</div>
    <div class="pbody"><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p>${chips}
      <div class="price">${esc(price || '')}</div>
      <button class="btn ${p.askStock ? 'gold' : ''} block" data-order>${ico(p.askStock ? 'message-circle-question' : 'shopping-cart')}${esc(p.buttonLabel || 'Beli via Discord')}</button></div>
  </article>`;
}).join('');

$('#products').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const p = C.products.items[card.dataset.i];
  const chip = e.target.closest('.chip');
  if (chip) {
    card.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
    $('.price', card).textContent = p.options[chip.dataset.opt].price;
    return;
  }
  if (e.target.closest('[data-order]')) {
    const on = card.querySelector('.chip.on');
    const o = p.options ? p.options[on ? on.dataset.opt : 0] : {};
    const msg = fill(p.askStock ? C.messages.askStock : C.messages.buy,
      { item: p.title, label: o.label || '', price: o.price || p.price || '' });
    sendToDiscord(msg);
  }
});

/* ---------- The Forge ---------- */
const f = C.forge;
$('#fg-info').innerHTML = `<div class="ico">${ico('hammer')}</div><h3 style="font-size:1.25rem;margin-bottom:10px">${esc(f.boxTitle)}</h3>
  <p class="muted" style="font-size:.88rem">${esc(f.boxText)}</p><ol class="steps">${f.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;
$('#fg-discord').innerHTML = ico('message-square') + esc(f.discordButton);
$('#f-submit').innerHTML = ico('send') + esc(f.submitLabel);
$('#f-type').innerHTML = f.services.map(s => `<option>${esc(s)}</option>`).join('');
$('#order-form').addEventListener('submit', e => {
  e.preventDefault();
  sendToDiscord(fill(C.messages.commission, { user: $('#f-user').value, service: $('#f-type').value, detail: $('#f-desc').value }));
});

/* ---------- Footer ---------- */
$('#ft-name').textContent = C.footer.copyright;
$('#ft-tag').textContent = C.footer.tagline;
$('#ft-by').textContent = C.footer.creator;

/* ---------- Util: salin + buka Discord ---------- */
function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2600);
}
async function sendToDiscord(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const a = document.createElement('textarea'); a.value = text; document.body.append(a); a.select(); try { document.execCommand('copy'); } catch {} a.remove(); }
  toast(C.messages.copied);
  setTimeout(() => window.open(C.links.discord, '_blank', 'noopener'), 900);
}

/* ---------- Daun jatuh ---------- */
const L = C.leaves, layer = $('#leaves');
if (L.enabled) {
  const n = window.innerWidth < 700 ? L.mobileCount : L.desktopCount;
  const r = (a, b) => a + Math.random() * (b - a);
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span'); s.className = 'leaf';
    s.style.left = r(0, 100) + '%';
    s.style.cssText += `;--s:${r(L.minSize, L.maxSize)}px;--o:${r(.3, .6)};--d:${r(L.minDuration, L.maxDuration)}s;--dl:${-r(0, 18)}s;--dr:${r(-90, 90)}px;--r:${r(0, 360)}deg`;
    layer.append(s);
  }
}

/* ---------- Musik ---------- */
const mBtn = $('#music'), M = C.music;
if (!M.enabled) mBtn.hidden = true;
else {
  const audio = new Audio(M.file);
  audio.loop = true; audio.volume = M.volume; audio.preload = 'auto';
  const ui = on => {
    mBtn.classList.toggle('playing', on);
    mBtn.title = on ? M.playTitle : M.muteTitle;
    mBtn.setAttribute('aria-label', mBtn.title);
    mBtn.setAttribute('aria-pressed', on);
  };
  const start = () => audio.play().then(() => { ui(true); return true; }).catch(() => false);
  mBtn.addEventListener('click', () => audio.paused ? start() : (audio.pause(), ui(false)));
  ui(false);

  if (M.autoplay) {
    // 1) coba langsung; 2) kalau diblokir browser, mulai di interaksi pertama
    start().then(ok => {
      if (ok) return;
      const evs = ['pointerdown', 'touchstart', 'keydown', 'wheel'];
      const once = e => {
        if (e.target.closest && e.target.closest('#music')) return cleanup();
        start().then(ok => ok && cleanup());
      };
      const cleanup = () => evs.forEach(v => window.removeEventListener(v, once, true));
      evs.forEach(v => window.addEventListener(v, once, { capture: true, passive: true }));
    });
  }
}

/* ---------- Init ---------- */
switchTab('dashboard');
window.scrollTo(0, 0);
lucide.createIcons();
</script>
</body>
</html>
